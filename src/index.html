<!DOCTYPE html>
<html lang="sr">

<head>
    <!-- Патцхује га entrypoint.sh на ${BASE_PATH}/ да релативни ресурси раде под префиксом. -->
    <base href="/">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Base</title>
    <script>
        // Синхроно, пре bundle-а: руте и префикс морају да постоје већ при првом извршавању
        // модула. Без тихог одступања — ако config.json изостане, __RUNTIME_CONFIG__ остаје
        // неспостављен, а апликација то претвара у видљив екран уместо у погрешан префикс.
        (function () {
            try {
                var xhr = new XMLHttpRequest()
                xhr.open('GET', 'config.json', false)
                xhr.send(null)
                if (xhr.status === 200) {
                    window.__RUNTIME_CONFIG__ = JSON.parse(xhr.responseText)
                }
            } catch (e) {
                /* грешку пријављује апликација, овде нема где да се прикаже */
            }
        })()
    </script>
</head>

<body>
    <div id="root"></div>
</body>

</html>
